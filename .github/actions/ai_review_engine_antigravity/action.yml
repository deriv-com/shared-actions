name: ai_review_engine_antigravity
description: >
  AI PR review engine — Google Antigravity CLI (`agy`). Reads a pre-built
  review context and a pre-fetched PR diff, reviews the checked-out code with
  read-only tools confined by a PreToolUse path guard, and captures the review
  markdown from `agy -p --output-format json`. It posts nothing: it is given
  no GitHub token, no shell tool, and no write tool. The calling workflow owns
  comment posting.

# ENGINE CONTRACT (see .github/workflows/AI_PR_REVIEW_README.md)
#
# The caller guarantees: PR head is checked out; review_context_path and
# pr_diff_path exist and are non-empty; the access gate has passed.
#
# This engine must: strip PR-supplied agent config FIRST, grant the model no
# shell tool and no write tool, write the review to output_path, and fail with
# an engine-named message if it wrote nothing. It must not post PR comments or
# reach the GitHub API on the model's behalf.
#
# Composite-action gotchas that constrain this file:
#   - The secrets context is not readable here, so api_key arrives as an input.
#   - timeout-minutes is invalid on the steps below; the caller's dispatch
#     step carries it.
#   - All steps share one log group, so failures must name this engine.
#
# HOW THIS ENGINE IS CONFINED (verified against agy 1.5.5 against a local mock
# Gemini endpoint when introducing this engine; re-verify every point on a
# cli_version bump):
#   1. Read-only tool surface + stdout JSON capture. The model never writes
#      output_path: `agy -p --output-format json` emits a single JSON envelope
#      on stdout, and the ENGINE verifies `.status == "SUCCESS"`, an empty
#      `.finished_reason` (rejecting partial `print_timeout` / `interrupted` /
#      `error` turns), and a non-empty `.response` before writing output_path
#      itself.
#   2. Dual-layer tool and path confinement (both independent, both fail-closed):
#      a) `settings.json` sets `allowNonWorkspaceAccess: false`,
#         `enableTerminalSandbox: true`, `toolPermission: "request-review"`,
#         `disableSlashCommands: true`, allows `read_file(...)` only for the
#         caller's context and diff paths (both raw and canonical realpath,
#         since `agy` resolves symlinks before matching `permissions.allow`),
#         and denies `command(*)`, `write_file(*)`, `read_file(.git/)`,
#         `read_url(*)`, `execute_url(*)`, and `mcp(*)`.
#      b) `$HOME/.gemini/config/hooks.json` registers `./agy-path-guard.js` as
#         a match-all (`"*"`) `PreToolUse` hook (unit-tested in
#         lint-actions.yml). It allow-lists only `read_file` / `view_file`
#         (workspace minus `.git/`, plus context and diff) and `list_dir` /
#         `find_by_name` / `grep_search` (workspace minus `.git/`), resolves
#         symlinks before checking, denies every write, shell, web, subagent,
#         task, schedule, MCP, or unknown tool, and logs every decision to
#         `PATH_GUARD_LOG`. If the hook script cannot execute, the command
#         fallback emits a JSON `deny` decision. After the run, an empty
#         `PATH_GUARD_LOG` fails the job closed.
#   3. Isolated home and pristine config restoration. `HOME` and `XDG_*` point
#      to `runner.temp/antigravity-engine-home` (outside `/tmp` and the
#      checkout). Because `agy` normalizes and rewrites `settings.json` on
#      startup, read-only pristine copies of `settings.json` and `hooks.json`
#      are hash-checked and restored before each attempt, alongside re-running
#      the hash-checked strip script.
#   4. Routing to LiteLLM. `settings.json` sets `"modelProvider": "gemini"` and
#      registers the selected `model` under `customModelsConfig.customModels`
#      as `gemini-api://<model>` with `TOOL_FORMATTER_TYPE_NONE` (verified on
#      `agy` 1.5.5: its built-in offline `modelProvider: "gemini"` catalog
#      stopped at `gemini-4-argon`, and `gemini-api://<model>` makes `agy`
#      request `POST /v1beta/models/<model>:streamGenerateContent?alt=sse` on
#      `GOOGLE_GEMINI_BASE_URL` with `x-goog-api-key: $GEMINI_API_KEY`, working
#      for both `gemini-4-carbon` and built-in or custom proxy aliases). A
#      trailing `/v1` or `/v1beta` is stripped from `base_url` so the shared
#      `https://litellmsa.deriv.ai/v1` caller default hits LiteLLM's native
#      `/v1beta/models/...` Gemini route instead of `/v1/v1beta/...`.
#   5. Gemini effort handling. Gemini models (`gemini-4-carbon`,
#      `gemini-4-argon`, `gemini-3.8-flash`) support `low`, `medium` (default
#      on `gemini-4-carbon`), and `high`. Verified on `agy` 1.5.5: omitting
#      `--effort` on a `customModelsConfig` entry sends `thinkingBudget: -1`,
#      which Gemini 4 Carbon rejects with HTTP 400 (`thinking_budget` is
#      unsupported on Gemini 4). When `antigravity_effort` is empty, the engine
#      passes `--effort medium` so `agy` sends `thinkingLevel: "MEDIUM"`.
#   6. Version pinning by assertion. Google distributes `agy` via
#      `https://antigravity.google/cli/install.sh` (which verifies SHA-512
#      against the release manifest, then installs the newest release). The
#      install step downloads `install.sh` to a file over pinned HTTPS (never
#      piped into bash), logs its SHA-256, runs with
#      `AGY_CLI_DISABLE_AUTO_UPDATE=true`, and asserts `agy --version` equals
#      `cli_version`.

inputs:
  review_context_path:
    description: "Path to the pre-built review context markdown (instructions, PR metadata, previous review, acknowledged suggestions, required output format). Built by the caller."
    required: false
    default: "/tmp/review_context.md"
  pr_diff_path:
    description: "Path to the pre-fetched PR diff. Fetched by the caller with the trusted token so this engine needs neither a shell tool nor network access."
    required: false
    default: "/tmp/pr_diff.txt"
  output_path:
    description: "Path this engine MUST write the final review markdown to. Must resolve (after realpath, so `..` cannot escape) under /tmp. The model has no write tool; the engine extracts `.response` from `agy -p --output-format json` under runner.temp and copies it here itself, then refuses anything that is not a regular, singly-linked file under /tmp."
    required: false
    default: "/tmp/ai_review_output.txt"
  repository:
    description: "owner/repo of the PR under review (prompt preamble only)."
    required: true
  pr_number:
    description: "Number of the PR under review (prompt preamble only)."
    required: true
  model:
    description: "Model ID as the endpoint in base_url names it. Defaults to `gemini-4-carbon` (LiteLLM's Gemini 4 Carbon alias). Registered in `customModelsConfig` as `gemini-api://<model>` and passed to `agy` via `--model`."
    required: false
    default: "gemini-4-carbon"
  base_url:
    description: "LLM API base URL. A trailing `/v1` or `/v1beta` is stripped before setting `GOOGLE_GEMINI_BASE_URL` because `agy` appends `/v1beta/models/<model>:streamGenerateContent` itself — accepting `/v1` and stripping keeps one caller-facing default working across every engine."
    required: false
    default: "https://litellmsa.deriv.ai/v1"
  api_key:
    description: "API key for base_url (the LiteLLM virtual key). Composite actions cannot read the secrets context, so the caller must pass this explicitly. Mapped to `GEMINI_API_KEY` in the run step env and never written to disk."
    required: true
  antigravity_effort:
    description: "[engine-specific: antigravity] Reasoning effort for the review turn: low, medium, or high (the levels Gemini models support in Antigravity CLI and on the Gemini API; Gemini 4 rejects minimal and does not expose Claude-only tiers). Empty uses `medium` (Gemini 4 Carbon's default, passed explicitly as `--effort medium` so custom model entries send `thinkingLevel: MEDIUM` rather than `thinkingBudget: -1`). Other engines ignore this input."
    required: false
    default: ""
  cli_version:
    description: "Exact Antigravity CLI (`agy`) version to install. Google distributes `agy` via `https://antigravity.google/cli/install.sh`, which always installs the newest release, so the pin is enforced by asserting `agy --version` after install and freezing background updates with `AGY_CLI_DISABLE_AUTO_UPDATE=true`. Bump via PR after re-verifying this file's confinement notes."
    required: false
    default: "1.5.5"

outputs:
  output_path:
    description: "Path the review markdown was written to."
    value: ${{ steps.run.outputs.output_path }}

runs:
  using: composite
  steps:
    # Security boundary, not hygiene. Antigravity CLI discovers `AGENTS.md`,
    # `GEMINI.md`, `.agents/` (rules, skills, agents, plugins, `hooks.json`,
    # `mcp_config.json`), legacy `.agent/`, and `~/.gemini/` customizations.
    # Workspace `.agents/hooks.json` can execute arbitrary shell commands and
    # `.agents/mcp_config.json` can launch local MCP servers — all PR-controlled
    # if left in the checkout.
    - name: Strip PR-supplied agent config (Antigravity CLI)
      id: strip
      shell: bash
      working-directory: ${{ github.workspace }}
      env:
        STRIP_SCRIPT: ${{ runner.temp }}/antigravity-engine-bin/strip-agent-config.sh
      run: |
        mkdir -p "$(dirname "$STRIP_SCRIPT")"
        cat > "$STRIP_SCRIPT" <<'STRIP_EOF'
        # Sourced/executed with the checkout as the working directory.
        # Recursive, case-insensitive, and symlink-aware (`-type l`) so neither
        # nested instruction files nor symlinked `.agents` / `GEMINI.md` survive.
        # `.git` is pruned so the sweep cannot corrupt the checkout.
        find . -name .git -prune -o \( -type f -o -type l \) \
          \( -iname 'agents.md' -o -iname 'agent.md' -o -iname 'gemini.md' \
             -o -iname 'claude.md' -o -iname 'claude.local.md' \
             -o -iname 'kimi.md' -o -iname 'codex.md' \
             -o -iname '.mcp.json' -o -iname '.cursorrules' \) \
          -print0 | xargs -0 -r rm -f
        find . -name .git -prune -o \( -type d -o -type l \) \
          \( -iname '.agents' -o -iname '.agent' -o -iname '.gemini' \
             -o -iname '.antigravity' -o -iname '.antigravitycli' \
             -o -iname '.claude' -o -iname '.claude-plugin' \
             -o -iname '.codex' -o -iname '.muse' -o -iname '.grok' \) \
          -print0 | xargs -0 -r rm -rf
        find . -name .git -prune -o \( -type d -o -type l \) -ipath '*/.cursor/rules' \
          -print0 | xargs -0 -r rm -rf
        STRIP_EOF

        bash -euo pipefail "$STRIP_SCRIPT"

        # Clear any leftover Antigravity state in the persistent runner's real
        # home as well (all CLI invocations below use an isolated HOME under
        # runner.temp, never the real home).
        rm -rf "$HOME/.gemini/antigravity-cli" "$HOME/.gemini/config" \
          "$HOME/.gemini/skills" "$HOME/.cache/antigravity"
        rm -f "$HOME/.gemini/AGENTS.md" "$HOME/.gemini/GEMINI.md"

        echo "strip_sha256=$(sha256sum "$STRIP_SCRIPT" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
        echo "✅ Stripped PR-supplied agent config (recursive)"

    - name: Set up Node.js
      # For the PreToolUse path guard (`agy-path-guard.js`). Pinned to the same
      # commit SHA as the Kimi, Anthropic, Grok, and Codex engines.
      uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
      with:
        node-version: "22"

    - name: Install review CLI (Antigravity CLI)
      shell: bash
      env:
        CLI_VERSION: ${{ inputs.cli_version }}
        # Keep `AGY_ENGINE_WORK` intact — the strip step already wrote
        # `strip-agent-config.sh` inside it. Install the CLI binary into a
        # sibling `${AGY_ENGINE_WORK}-cli` directory and the installer script
        # into its own wiped directory.
        AGY_ENGINE_WORK: ${{ runner.temp }}/antigravity-engine-bin
        AGY_ENGINE_HOME: ${{ runner.temp }}/antigravity-engine-home
        AGY_INSTALLER_DIR: ${{ runner.temp }}/antigravity-engine-installer
        AGY_CLI_DISABLE_AUTO_UPDATE: "true"
      run: |
        rm -rf "$AGY_ENGINE_HOME" "${AGY_ENGINE_WORK}-cli" "$AGY_INSTALLER_DIR"
        rm -f "$AGY_ENGINE_WORK/review-output.json" "$AGY_ENGINE_WORK/review-stdout.txt" \
          "$AGY_ENGINE_WORK/cli.log" "$AGY_ENGINE_WORK/agy-diag.log"
        mkdir -p "$AGY_ENGINE_HOME" "${AGY_ENGINE_WORK}-cli" "$AGY_INSTALLER_DIR"

        # Download the official bootstrapper to disk over HTTPS (never pipe a
        # remote script into bash) and log its SHA-256 for audit correlation.
        # `install.sh` verifies the release tarball's SHA-512 against Google's
        # platform manifest before extracting `agy`.
        INSTALLER="$AGY_INSTALLER_DIR/install.sh"
        curl -fsSL --proto '=https' --tlsv1.2 https://antigravity.google/cli/install.sh -o "$INSTALLER"
        echo "Antigravity CLI installer sha256: $(sha256sum "$INSTALLER" | cut -d' ' -f1)"

        HOME="$AGY_ENGINE_HOME" \
        XDG_CONFIG_HOME="$AGY_ENGINE_HOME/.config" \
        XDG_DATA_HOME="$AGY_ENGINE_HOME/.local/share" \
        XDG_CACHE_HOME="$AGY_ENGINE_HOME/.cache" \
        AGY_CLI_DISABLE_AUTO_UPDATE="true" \
          bash "$INSTALLER" --dir "${AGY_ENGINE_WORK}-cli"

        AGY_BIN="${AGY_ENGINE_WORK}-cli/agy"
        [[ -x "$AGY_BIN" ]] || { echo "❌ Antigravity engine: installer produced no agy binary at $AGY_BIN"; exit 1; }

        VERSION_OUT="$(
          HOME="$AGY_ENGINE_HOME" \
          XDG_CONFIG_HOME="$AGY_ENGINE_HOME/.config" \
          XDG_DATA_HOME="$AGY_ENGINE_HOME/.local/share" \
          XDG_CACHE_HOME="$AGY_ENGINE_HOME/.cache" \
          AGY_CLI_DISABLE_AUTO_UPDATE="true" \
            "$AGY_BIN" --version
        )"
        echo "Antigravity CLI installed: $VERSION_OUT"
        INSTALLED_VERSION="$(printf '%s' "$VERSION_OUT" | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | awk 'NR==1')"
        if [[ "$INSTALLED_VERSION" != "$CLI_VERSION" ]]; then
          echo "❌ Antigravity engine: installer delivered Antigravity CLI $INSTALLED_VERSION, but cli_version pins $CLI_VERSION."
          echo "   The installer always delivers the newest release; bump cli_version (and re-verify this engine's header notes) in a PR instead of running an unreviewed CLI."
          exit 1
        fi
        echo "✅ Antigravity engine: Antigravity CLI $CLI_VERSION installed (auto-update disabled)"

    - name: Configure review CLI (Antigravity CLI)
      id: configure
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
        AGY_ENGINE_HOME: ${{ runner.temp }}/antigravity-engine-home
        AGY_ENGINE_WORK: ${{ runner.temp }}/antigravity-engine-bin
        GUARD_DIR: ${{ runner.temp }}/antigravity-path-guard
        OUTPUT_PATH: ${{ inputs.output_path }}
        CONTEXT_PATH: ${{ inputs.review_context_path }}
        DIFF_PATH: ${{ inputs.pr_diff_path }}
        MODEL: ${{ inputs.model }}
        INPUT_BASE_URL: ${{ inputs.base_url }}
      run: |
        # Output must resolve under /tmp so a caller cannot point it into the
        # checked-out tree.
        OUTPUT_REAL="$(realpath -m -- "$OUTPUT_PATH")"
        case "$OUTPUT_REAL" in
          /tmp/*) ;;
          *)
            echo "❌ Antigravity engine: output_path must resolve under /tmp: $OUTPUT_PATH (resolves to $OUTPUT_REAL)"
            exit 1
            ;;
        esac

        # Isolated HOME holds `settings.json` and `hooks.json` and must sit
        # outside `/tmp`, `/var/tmp`, `$TMPDIR`, and the PR checkout.
        HOME_REAL="$(realpath -m -- "$AGY_ENGINE_HOME")"
        WS_REAL="$(realpath -m -- "$GITHUB_WORKSPACE")"
        case "$HOME_REAL/" in
          /tmp/*|/var/tmp/*|"$WS_REAL"/*)
            echo "❌ Antigravity engine: AGY_ENGINE_HOME ($HOME_REAL) is inside /tmp or the checkout; refusing to place CLI config there."
            exit 1
            ;;
        esac
        if [[ -n "${TMPDIR:-}" ]] && [[ "$HOME_REAL/" == "$(realpath -m -- "$TMPDIR")"/* ]]; then
          echo "❌ Antigravity engine: AGY_ENGINE_HOME ($HOME_REAL) is inside \$TMPDIR; refusing to place CLI config there."
          exit 1
        fi

        # Strip trailing `/`, `/v1beta`, and `/v1`: `agy` appends
        # `/v1beta/models/<model>:streamGenerateContent` to
        # `GOOGLE_GEMINI_BASE_URL` itself.
        BASE_URL="${INPUT_BASE_URL%/}"
        BASE_URL="${BASE_URL%/v1beta}"
        BASE_URL="${BASE_URL%/v1}"
        BASE_URL="${BASE_URL%/}"

        model_re='^[A-Za-z0-9._:/@-]+$'
        base_url_re='^https?://[A-Za-z0-9._~:/?#@!$&()*+,;=%-]+$'
        if [[ ! $MODEL =~ $model_re ]]; then
          echo "❌ Antigravity engine: model contains characters not allowed in a model id: '$MODEL'"
          exit 1
        fi
        if [[ ! $BASE_URL =~ $base_url_re ]]; then
          echo "❌ Antigravity engine: base_url must be an http(s) URL with no quotes, backslashes or whitespace: '$BASE_URL'"
          exit 1
        fi

        # 1. Install and syntax-check the PreToolUse path guard outside the checkout.
        rm -rf "$GUARD_DIR"
        mkdir -p "$GUARD_DIR"
        GUARD_JS="$GUARD_DIR/agy-path-guard.js"
        cp "$ACTION_PATH/agy-path-guard.js" "$GUARD_JS"
        chmod 0444 "$GUARD_JS"
        node --check "$GUARD_JS"
        GUARD_SHA256="$(sha256sum "$GUARD_JS" | cut -d' ' -f1)"

        # 2. Build `settings.json`. Include both raw and canonical paths for
        #    `CONTEXT_PATH` and `DIFF_PATH` in `permissions.allow` because `agy`
        #    canonicalises target paths before matching allow-rules when
        #    `allowNonWorkspaceAccess` is `false`.
        CONTEXT_REAL="$(realpath -m -- "$CONTEXT_PATH")"
        DIFF_REAL="$(realpath -m -- "$DIFF_PATH")"
        SETTINGS_DIR="$AGY_ENGINE_HOME/.gemini/antigravity-cli"
        HOOKS_DIR="$AGY_ENGINE_HOME/.gemini/config"
        mkdir -p "$SETTINGS_DIR" "$HOOKS_DIR"

        jq -n \
          --arg model "$MODEL" \
          --arg ctx_raw "$CONTEXT_PATH" \
          --arg ctx_real "$CONTEXT_REAL" \
          --arg diff_raw "$DIFF_PATH" \
          --arg diff_real "$DIFF_REAL" \
          '{
            modelProvider: "gemini",
            allowNonWorkspaceAccess: false,
            enableTerminalSandbox: true,
            toolPermission: "request-review",
            artifactReviewPolicy: "always-proceed",
            disableSlashCommands: true,
            historySize: 0,
            notifications: false,
            showTips: false,
            showFeedbackSurvey: false,
            permissions: {
              allow: (
                [
                  ("read_file(" + $ctx_raw + ")"),
                  ("read_file(" + $ctx_real + ")"),
                  ("read_file(" + $diff_raw + ")"),
                  ("read_file(" + $diff_real + ")")
                ] | unique
              ),
              deny: [
                "command(*)",
                "write_file(*)",
                "read_file(.git/)",
                "read_url(*)",
                "execute_url(*)",
                "mcp(*)"
              ]
            },
            customModelsConfig: {
              customModels: {
                ($model): {
                  modelName: ("gemini-api://" + $model),
                  label: $model,
                  maxTokens: 1048576,
                  toolFormatterType: "TOOL_FORMATTER_TYPE_NONE"
                }
              }
            }
          }' > "$SETTINGS_DIR/settings.json"

        # 3. Build `hooks.json`. A guard failure or crash still emits a valid
        #    JSON `deny` decision so a broken hook fails closed.
        HOOK_CMD="node '${GUARD_JS}' || printf '%s\n' '{\"decision\":\"deny\",\"reason\":\"path guard failed to execute\"}'"
        jq -n \
          --arg cmd "$HOOK_CMD" \
          '{
            "ai-review-path-guard": {
              PreToolUse: [
                {
                  matcher: "*",
                  hooks: [
                    {
                      type: "command",
                      command: $cmd,
                      timeout: 30
                    }
                  ]
                }
              ]
            }
          }' > "$HOOKS_DIR/hooks.json"

        # Keep read-only pristine copies (`agy` normalises `settings.json` on
        # startup, dropping default-valued keys; restoring from pristine before
        # each attempt guarantees identical settings across retries).
        SETTINGS_PRISTINE="$AGY_ENGINE_WORK/settings.json.pristine"
        HOOKS_PRISTINE="$AGY_ENGINE_WORK/hooks.json.pristine"
        mkdir -p "$AGY_ENGINE_WORK"
        rm -f "$SETTINGS_PRISTINE" "$HOOKS_PRISTINE"
        install -m 0444 "$SETTINGS_DIR/settings.json" "$SETTINGS_PRISTINE"
        install -m 0444 "$HOOKS_DIR/hooks.json" "$HOOKS_PRISTINE"

        SETTINGS_SHA256="$(sha256sum "$SETTINGS_PRISTINE" | cut -d' ' -f1)"
        HOOKS_SHA256="$(sha256sum "$HOOKS_PRISTINE" | cut -d' ' -f1)"

        echo "🔧 Antigravity engine | model=$MODEL | base_url=$BASE_URL"
        {
          echo "base_url=$BASE_URL"
          echo "model=$MODEL"
          echo "guard_sha256=$GUARD_SHA256"
          echo "settings_sha256=$SETTINGS_SHA256"
          echo "hooks_sha256=$HOOKS_SHA256"
        } >> "$GITHUB_OUTPUT"
        echo "✅ Antigravity engine: settings, hooks, and PreToolUse path guard configured (home=$AGY_ENGINE_HOME)"

    - name: Run AI PR review (Antigravity CLI)
      id: run
      shell: bash
      working-directory: ${{ github.workspace }}
      env:
        AGY_ENGINE_HOME: ${{ runner.temp }}/antigravity-engine-home
        AGY_BIN: ${{ runner.temp }}/antigravity-engine-bin-cli/agy
        # Credentials stay in process env only (`GEMINI_API_KEY` + `modelProvider: "gemini"`
        # is what `agy` reads) and are never written to disk.
        GEMINI_API_KEY: ${{ inputs.api_key }}
        GOOGLE_GEMINI_BASE_URL: ${{ steps.configure.outputs.base_url }}
        AGY_CLI_DISABLE_AUTO_UPDATE: "true"
        AGY_CLI_HIDE_LOGO: "1"
        AGY_CLI_OSC7501: "off"
        CI: "1"
        CONTEXT_PATH: ${{ inputs.review_context_path }}
        DIFF_PATH: ${{ inputs.pr_diff_path }}
        OUTPUT_PATH: ${{ inputs.output_path }}
        MODEL: ${{ steps.configure.outputs.model }}
        ANTIGRAVITY_EFFORT: ${{ inputs.antigravity_effort }}
        STRIP_SCRIPT: ${{ runner.temp }}/antigravity-engine-bin/strip-agent-config.sh
        STRIP_SHA256: ${{ steps.strip.outputs.strip_sha256 }}
        GUARD_JS: ${{ runner.temp }}/antigravity-path-guard/agy-path-guard.js
        GUARD_SHA256: ${{ steps.configure.outputs.guard_sha256 }}
        PATH_GUARD_LOG: ${{ runner.temp }}/antigravity-path-guard/decisions.log
        SETTINGS_PRISTINE: ${{ runner.temp }}/antigravity-engine-bin/settings.json.pristine
        SETTINGS_SHA256: ${{ steps.configure.outputs.settings_sha256 }}
        HOOKS_PRISTINE: ${{ runner.temp }}/antigravity-engine-bin/hooks.json.pristine
        HOOKS_SHA256: ${{ steps.configure.outputs.hooks_sha256 }}
        STAGE_JSON: ${{ runner.temp }}/antigravity-engine-bin/review-output.json
        STAGE_TEXT: ${{ runner.temp }}/antigravity-engine-bin/review-stdout.txt
        CLI_LOG: ${{ runner.temp }}/antigravity-engine-bin/cli.log
        AGY_DIAG_LOG: ${{ runner.temp }}/antigravity-engine-bin/agy-diag.log
      run: |
        [[ -s "$CONTEXT_PATH" ]] || { echo "❌ Antigravity engine: missing or empty review context at $CONTEXT_PATH"; exit 1; }
        [[ -s "$DIFF_PATH"    ]] || { echo "❌ Antigravity engine: missing or empty PR diff at $DIFF_PATH"; exit 1; }
        [[ -x "$AGY_BIN"      ]] || { echo "❌ Antigravity engine: agy binary missing at $AGY_BIN (install step did not run?)"; exit 1; }

        # Dual-validate `antigravity_effort` here as well as in the orchestrator
        # because composite actions can be called directly at `@master`.
        # Verified on `agy` 1.5.5: omitting `--effort` on a `customModelsConfig`
        # entry sends `thinkingBudget: -1`, which Gemini 4 Carbon rejects with
        # HTTP 400 (`thinking_budget` is unsupported on Gemini 4). Defaulting an
        # empty knob to `medium` sends `thinkingLevel: "MEDIUM"` on the wire,
        # matching Gemini 4 Carbon's documented default.
        EFFECTIVE_EFFORT="medium"
        if [[ -n "$ANTIGRAVITY_EFFORT" ]]; then
          case "$ANTIGRAVITY_EFFORT" in
            low|medium|high) ;;
            *)
              echo "❌ Antigravity engine: antigravity_effort must be one of low|medium|high (or empty), got '$ANTIGRAVITY_EFFORT'"
              exit 1
              ;;
          esac
          EFFECTIVE_EFFORT="$ANTIGRAVITY_EFFORT"
          echo "🔧 Antigravity engine | antigravity_effort=$ANTIGRAVITY_EFFORT"
        fi
        EFFORT_ARGS=(--effort "$EFFECTIVE_EFFORT")

        echo "🔧 Antigravity engine | model=$MODEL | effective_effort=$EFFECTIVE_EFFORT | agy_home=$AGY_ENGINE_HOME"

        # Quoted heredoc: Actions substitutes `inputs.*` before bash parses the
        # script, so no shell expansion happens in the prompt body. Do NOT place
        # an empty Actions expression pair anywhere in this `run:` block.
        cat > /tmp/review_prompt.txt <<'EOF'
        REPO: ${{ inputs.repository }}
        PR NUMBER: ${{ inputs.pr_number }}

        Read ${{ inputs.review_context_path }} and follow it exactly. It
        contains the full review instructions, PR context, previous review
        (if any), acknowledged suggestions to skip, and the required output
        format — plus a "Review Procedure" section telling you what else to
        read, including the pre-fetched PR diff at ${{ inputs.pr_diff_path }}.
        Files may be longer than one read window: keep reading with StartLine /
        EndLine or ByteOffset until you reach the end. You have no network
        access, no shell tool, and no write tool; everything you need is on
        disk.

        ONE DELIVERY OVERRIDE: the context's procedure tells you to write the
        review to ${{ inputs.output_path }} with a Write tool. You have no
        write tool in this engine, and you must NOT create Antigravity
        artifacts. Instead, print the complete review as your final reply —
        the caller captures your reply as the review. Do not wrap file paths in
        `file://` links (use plain repo-relative `path:line` references), and
        do not add a title, a **Model:** line, an **Effort:** line, or HTML
        comments; start with the Summary section, exactly as the context's
        output format requires. An analysis that is not your final reply is
        lost and the job fails.
        EOF

        dump_agy_log() {
          set +e +o pipefail
          bytes_of() { wc -c < "$1" 2>/dev/null | tr -d '[:space:]' || echo '?'; }

          echo "ℹ️  config: model=$MODEL base_url=$GOOGLE_GEMINI_BASE_URL effective_effort=$EFFECTIVE_EFFORT agy_home=$AGY_ENGINE_HOME"
          echo "ℹ️  input bytes: context=$(bytes_of "$CONTEXT_PATH") diff=$(bytes_of "$DIFF_PATH") prompt=$(bytes_of /tmp/review_prompt.txt)"
          if [[ -s "$STAGE_TEXT" ]]; then
            echo "ℹ️  review text: PRESENT in staging ($(bytes_of "$STAGE_TEXT") bytes)"
          else
            echo "ℹ️  review text: ABSENT in staging"
          fi
          if [[ -s "$STAGE_JSON" ]]; then
            STOP_TOKEN="agy-json-$(od -An -N8 -tx1 /dev/urandom | tr -d ' \n')"
            echo "--- JSON envelope metadata ---"
            echo "::stop-commands::$STOP_TOKEN"
            jq -c '{status, finished_reason, error, denied_actions, num_turns, duration_seconds, usage}' "$STAGE_JSON" 2>/dev/null || head -c 1000 "$STAGE_JSON"
            echo ""
            echo "::$STOP_TOKEN::"
          fi
          for log_file in "$CLI_LOG" "$AGY_DIAG_LOG"; do
            if [[ -s "$log_file" ]]; then
              STOP_TOKEN="agy-log-$(od -An -N8 -tx1 /dev/urandom | tr -d ' \n')"
              lines=$(wc -l < "$log_file" | tr -d '[:space:]')
              echo "--- $log_file (last 100 of $lines lines) ---"
              echo "::stop-commands::$STOP_TOKEN"
              tail -n 100 "$log_file"
              echo "::$STOP_TOKEN::"
            fi
          done
          echo "ℹ️  Troubleshooting: a 404 or 400 on the first model call means LiteLLM is not"
          echo "    serving the Gemini /v1beta/models/<model>:streamGenerateContent endpoint for"
          echo "    '$MODEL' yet, or the virtual key is not authorised for that alias."
        }

        review_file_ok() {
          [[ -e "$OUTPUT_PATH" || -L "$OUTPUT_PATH" ]] || return 1
          if [[ -L "$OUTPUT_PATH" || ! -f "$OUTPUT_PATH" ]]; then
            echo "❌ Antigravity engine: $OUTPUT_PATH is not a regular file (symlink or special file). Refusing it."
            exit 1
          fi
          if [[ "$(stat -c %h -- "$OUTPUT_PATH" 2>/dev/null || stat -f %l -- "$OUTPUT_PATH")" -ne 1 ]]; then
            echo "❌ Antigravity engine: $OUTPUT_PATH has more than one hard link. Refusing it."
            exit 1
          fi
          case "$(realpath -e -- "$OUTPUT_PATH")" in
            /tmp/*) ;;
            *) echo "❌ Antigravity engine: $OUTPUT_PATH no longer resolves under /tmp. Refusing it."; exit 1 ;;
          esac
          [[ -s "$OUTPUT_PATH" ]]
        }

        pre_attempt_guard() {
          [[ -n "$STRIP_SHA256" && -n "$GUARD_SHA256" && -n "$SETTINGS_SHA256" && -n "$HOOKS_SHA256" ]] || {
            echo "❌ Antigravity engine: strip/configure step outputs missing"
            exit 1
          }
          if [[ "$(sha256sum "$STRIP_SCRIPT" | cut -d' ' -f1)" != "$STRIP_SHA256" ]]; then
            echo "❌ Antigravity engine: strip script changed since the strip step. Refusing to start the CLI."
            exit 1
          fi
          bash -euo pipefail "$STRIP_SCRIPT"

          if [[ "$(sha256sum "$GUARD_JS" | cut -d' ' -f1)" != "$GUARD_SHA256" ]]; then
            echo "❌ Antigravity engine: path guard script changed since the configure step. Refusing to start the CLI."
            exit 1
          fi
          if [[ "$(sha256sum "$SETTINGS_PRISTINE" | cut -d' ' -f1)" != "$SETTINGS_SHA256" ]]; then
            echo "❌ Antigravity engine: pristine settings.json changed since the configure step. Refusing to start the CLI."
            exit 1
          fi
          if [[ "$(sha256sum "$HOOKS_PRISTINE" | cut -d' ' -f1)" != "$HOOKS_SHA256" ]]; then
            echo "❌ Antigravity engine: pristine hooks.json changed since the configure step. Refusing to start the CLI."
            exit 1
          fi

          mkdir -p "$AGY_ENGINE_HOME/.gemini/antigravity-cli" "$AGY_ENGINE_HOME/.gemini/config"
          install -m 0600 "$SETTINGS_PRISTINE" "$AGY_ENGINE_HOME/.gemini/antigravity-cli/settings.json"
          install -m 0600 "$HOOKS_PRISTINE" "$AGY_ENGINE_HOME/.gemini/config/hooks.json"

          if [[ "$(sha256sum "$AGY_ENGINE_HOME/.gemini/antigravity-cli/settings.json" | cut -d' ' -f1)" != "$SETTINGS_SHA256" ]]; then
            echo "❌ Antigravity engine: restored settings.json hash mismatch. Refusing to start the CLI."
            exit 1
          fi
          if [[ "$(sha256sum "$AGY_ENGINE_HOME/.gemini/config/hooks.json" | cut -d' ' -f1)" != "$HOOKS_SHA256" ]]; then
            echo "❌ Antigravity engine: restored hooks.json hash mismatch. Refusing to start the CLI."
            exit 1
          fi

          # Reset per attempt so the post-run check proves the producing attempt
          # itself invoked the PreToolUse path guard.
          : > "$PATH_GUARD_LOG"
          : > "$STAGE_JSON"
          : > "$STAGE_TEXT"
          : > "$CLI_LOG"
          : > "$AGY_DIAG_LOG"
        }

        rm -f "$OUTPUT_PATH"
        REVIEW_PROMPT="$(cat /tmp/review_prompt.txt)"

        for attempt in 1 2; do
          pre_attempt_guard

          HOME="$AGY_ENGINE_HOME" \
          XDG_CONFIG_HOME="$AGY_ENGINE_HOME/.config" \
          XDG_DATA_HOME="$AGY_ENGINE_HOME/.local/share" \
          XDG_CACHE_HOME="$AGY_ENGINE_HOME/.cache" \
          "$AGY_BIN" -p "$REVIEW_PROMPT" \
            --model "$MODEL" \
            "${EFFORT_ARGS[@]}" \
            --output-format json \
            --disable-slash-commands \
            --print-timeout 25m \
            --log-file "$AGY_DIAG_LOG" \
            > "$STAGE_JSON" 2> "$CLI_LOG" < /dev/null && AGY_STATUS=0 || AGY_STATUS=$?

          if [[ -s "$STAGE_JSON" ]] \
             && jq -e 'type == "object" and .status == "SUCCESS" and ((.finished_reason // "") == "") and ((.response // "") | type == "string" and length > 0)' "$STAGE_JSON" >/dev/null 2>&1; then
            jq -r '.response' "$STAGE_JSON" > "$STAGE_TEXT"
            if [[ -s "$STAGE_TEXT" ]]; then
              cp -- "$STAGE_TEXT" "$OUTPUT_PATH"
              if review_file_ok; then
                if [[ ! -s "$PATH_GUARD_LOG" ]]; then
                  echo "⚠️  Antigravity engine: attempt $attempt produced a response without invoking any guarded tool ($PATH_GUARD_LOG empty) — discarding unconfined/unread output."
                  rm -f "$OUTPUT_PATH"
                else
                  if [[ "$AGY_STATUS" -ne 0 ]]; then
                    echo "⚠️  Antigravity engine: CLI exited $AGY_STATUS AFTER producing a complete SUCCESS envelope — keeping the review and continuing."
                    ( dump_agy_log ) || true
                  fi
                  break
                fi
              else
                rm -f "$OUTPUT_PATH"
              fi
            fi
          fi

          if [[ "$attempt" -eq 1 ]]; then
            echo "⚠️  Antigravity engine: CLI exited $AGY_STATUS without a complete review envelope — retrying once."
            ( dump_agy_log ) || true
            echo "🔁 Antigravity engine: attempt 2 of 2"
          fi
        done

        if ! review_file_ok; then
          echo "❌ Antigravity engine: no review written to $OUTPUT_PATH after 2 attempts (last CLI exit: ${AGY_STATUS:-unknown})"
          ( dump_agy_log ) || true
          exit 1
        fi

        # Neither review_context_path nor pr_diff_path is inline in the prompt,
        # so any genuine review run made at least one `read_file` / `view_file`
        # call during the producing attempt, which must have fired the match-all
        # PreToolUse hook. An empty log means either the hook stopped firing
        # under a CLI bump or the model answered without reading the PR at all.
        if [[ ! -s "$PATH_GUARD_LOG" ]]; then
          echo "❌ Antigravity engine: the review was produced but the path guard never ran (no decisions logged at $PATH_GUARD_LOG)."
          echo "   The PreToolUse hook in hooks.json is a required confinement boundary; refusing to hand an unconfined or unread review to the caller."
          rm -f -- "$OUTPUT_PATH"
          exit 1
        fi

        echo "✅ Antigravity engine: path guard handled $(wc -l < "$PATH_GUARD_LOG" | tr -d ' ') tool call(s), $(grep -c '^deny' "$PATH_GUARD_LOG" || true) denied"
        echo "✅ Antigravity engine: review written ($(wc -c < "$OUTPUT_PATH") bytes)"
        echo "output_path=$OUTPUT_PATH" >> "$GITHUB_OUTPUT"
