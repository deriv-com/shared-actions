name: ai_review_engine_kimi
description: >
  AI PR review engine — Kimi Code CLI. Reads a pre-built review context and a
  pre-fetched PR diff, reviews the checked-out code, and writes the review
  markdown to a file. It posts nothing: it is given no GitHub token and no shell
  tool. The calling workflow owns comment posting.

# ENGINE CONTRACT (see .github/workflows/AI_PR_REVIEW_README.md)
#
# The caller guarantees: PR head is checked out; review_context_path and
# pr_diff_path exist and are non-empty; the access gate has passed.
#
# This engine must: strip PR-supplied agent config FIRST, grant the model no
# shell tool, write the review to output_path, and fail with an engine-named
# message if it wrote nothing. It must not post PR comments or reach the GitHub
# API on the model's behalf.
#
# Composite-action gotchas that constrain this file:
#   - `secrets` is not readable here, so api_key arrives as an input.
#   - `timeout-minutes` is invalid on the steps below; the caller's dispatch
#     step carries it.
#   - All steps share one log group, so failures must name this engine.

inputs:
  review_context_path:
    description: "Path to the pre-built review context markdown (instructions, PR metadata, previous review, acknowledged suggestions, required output format). Built by the caller."
    required: false
    default: "/tmp/review_context.md"
  pr_diff_path:
    description: "Path to the pre-fetched PR diff. Fetched by the caller with the trusted token so this engine needs neither a shell tool nor network access."
    required: false
    default: "/tmp/pr_diff.txt"
  output_path:
    description: "Path this engine MUST write the final review markdown to. Its parent directory is the only location the CLI is permitted to write."
    required: false
    default: "/tmp/ai_review_output.txt"
  repository:
    description: "owner/repo of the PR under review (prompt preamble only)."
    required: true
  pr_number:
    description: "Number of the PR under review (prompt preamble only)."
    required: true
  model:
    description: "Model ID as the endpoint in base_url names it. With the LiteLLM proxy that is a proxy alias, e.g. `kimi-k3`. The Kimi-platform ids (`k3`, `k3-256k`, `kimi-for-coding`, `kimi-for-coding-highspeed`) only resolve against api.kimi.com/coding/v1 and return 400 from the proxy. Maps to KIMI_MODEL_NAME."
    required: false
    # Matches the default base_url below, which is the LiteLLM proxy.
    default: "kimi-k3"
  base_url:
    description: "LLM API base URL. A trailing /v1 is appended when absent, so the identical value also works for the anthropic engine (which needs it removed). Maps to KIMI_MODEL_BASE_URL."
    required: false
    default: "https://litellmsa.deriv.ai/v1"
  api_key:
    description: "API key for base_url. Composite actions cannot read the `secrets` context, so the caller must pass this explicitly. Maps to KIMI_MODEL_API_KEY and is never written to disk."
    required: true
  max_context_size:
    description: "Maximum context window in tokens. Must not exceed what the endpoint allows for the selected model, or the CLI over-packs context and the request is rejected. K3 is 1048576; the 256k variants are 262144. If a 400 persists after confirming the model name, try lowering this. Maps to KIMI_MODEL_MAX_CONTEXT_SIZE."
    required: false
    default: "1048576"
  provider_type:
    description: "Wire dialect the CLI speaks. One of kimi, anthropic, openai, openai_responses, google-genai, vertexai. MUST match what base_url actually serves: `kimi` targets the Kimi Code platform at api.kimi.com/coding/v1 and a LiteLLM proxy rejects it with a bare 400; `openai` speaks plain /v1/chat/completions, which is what the proxy serves. Defaults to `openai` to pair with the default base_url. Maps to KIMI_MODEL_PROVIDER_TYPE."
    required: false
    # Paired with the default base_url (the LiteLLM proxy). Verified: a plain
    # OpenAI-style chat/completions request for kimi-k3 succeeds against that
    # proxy, while provider_type=kimi returns 400 for the same model and key.
    default: "openai"
  cli_version:
    description: "Exact @moonshot-ai/kimi-code version to install. Pinned deliberately — the package is pre-1.0 and ships minor releases weekly, so `latest` risks both breaking changes and unreviewed code in a privileged job. Bump via PR."
    required: false
    default: "0.34.0"
  node_version:
    description: "Node.js version used to install and run the CLI."
    required: false
    default: "22"

outputs:
  output_path:
    description: "Path the review markdown was written to."
    value: ${{ steps.run.outputs.output_path }}

runs:
  using: composite
  steps:
    # Security boundary, not hygiene. Instruction files are a prompt-injection
    # vector, and project-level .kimi-code/mcp.json can declare MCP servers —
    # arbitrary local commands, NOT gated by the Bash deny rule below — while
    # local.toml can widen workspace access. These paths are engine-specific:
    # another engine must revisit this list, never inherit it.
    - name: Strip PR-supplied agent config (Kimi Code)
      shell: bash
      working-directory: ${{ github.workspace }}
      run: |
        # Recursive, not root-only. Instruction files are discovered per-directory
        # as an agent reads files there, and this review's prompt explicitly tells
        # it to traverse into dependencies — so a nested packages/foo/CLAUDE.md
        # would reach the model as trusted instructions even with the root file
        # deleted. .git is pruned so the sweep cannot corrupt the checkout.
        find . -name .git -prune -o \( -type f -o -type l \) \
          \( -name 'CLAUDE.md' -o -name 'CLAUDE.local.md' -o -name 'AGENTS.md' -o -name 'KIMI.md' \) \
          -print0 | xargs -0 -r rm -f
        find . -name .git -prune -o -type d -name '.kimi-code' \
          -print0 | xargs -0 -r rm -rf
        echo "✅ Stripped PR-supplied agent config (recursive)"

    - name: Set up Node.js
      # Pinned to a commit SHA, not a tag: tags are mutable, so `@v4` would let a
      # retagged release execute in a job holding the LLM API key and a
      # write-scoped GITHUB_TOKEN. Bump deliberately via PR.
      uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
      with:
        node-version: ${{ inputs.node_version }}

    - name: Install review CLI (Kimi Code)
      shell: bash
      env:
        CLI_VERSION: ${{ inputs.cli_version }}
      run: |
        npm install -g "@moonshot-ai/kimi-code@${CLI_VERSION}"
        kimi --version

    - name: Configure review CLI (Kimi Code)
      shell: bash
      env:
        OUTPUT_PATH: ${{ inputs.output_path }}
      run: |
        # Model and credentials are supplied entirely through the KIMI_MODEL_*
        # env channel on the run step — nothing sensitive is written to disk.
        # This step only restricts the tool surface: Read, Grep, Glob confined
        # to the PR checkout; Write confined to the output directory; no Bash.
        # The diff is pre-fetched, so the agent has no reason to run commands.
        #
        # Two controls, and they do not overlap:
        #   1. `[tools] enabled` is what removes Bash.
        #   2. The PreToolUse hook is what confines paths. It is the ONLY thing
        #      that does: in kimi-code 0.34.0 the `[[permission.rules]]` below
        #      are not applied in `-p` mode at all — a config with a bare
        #      `deny Read` still read files and `deny Write` still wrote into the
        #      checkout (verified against a mock model endpoint while fixing
        #      HackerOne #4037167). They stay as a statement of intent, and for
        #      the version that honours them; never treat them as enforcement.
        #
        # $HOME/.kimi-code is recreated rather than merged: on a persistent
        # self-hosted runner a previous run's config could otherwise survive
        # (e.g. a leftover mcp.json, which `cat > config.toml` would not remove).
        OUT_DIR="$(dirname "$OUTPUT_PATH")"
        rm -rf "$HOME/.kimi-code"
        mkdir -p "$HOME/.kimi-code"

        # Path guard. The CLI runs it before every Read/Grep/Glob/Write call with
        # the call's JSON on stdin; exit 2 denies the call and hands stderr to
        # the model as the reason. Allow-list, not deny-list: Read/Grep/Glob may
        # touch the PR checkout (minus .git/) and Read may also open the two input
        # files the caller prepared and the output file; Write may only land in
        # the output directory.
        # $RUNNER_TEMP (where actions/checkout parks a token), $HOME, /proc, ~,
        # and everything else fall outside that by construction. Symlinks are
        # resolved first so a link inside the checkout cannot alias a file
        # outside it. Any internal error also exits 2: the guard fails closed.
        # Node, not bash+jq: node is guaranteed present because the CLI runs on
        # it, and JSON/path handling is what goes wrong in shell.
        #
        # Self-contained on purpose, because the CLI treats a hook that times
        # out as ALLOW and the attacker controls the checkout the hook runs in
        # (its cwd). The script lives under $HOME/.kimi-code, which is wiped and
        # recreated above; it requires only `node:` builtins, which never touch
        # node_modules; and Node's package.json scope lookup walks UP from the
        # script's own directory, never into the checkout below it. A hostile
        # package.json / node_modules / .npmrc in the PR was tested and changes
        # nothing. Keep it that way: no npm packages, no reading repo files.
        # No `${{ }}` in here — Actions scans the whole run: string for them.
        cat > "$HOME/.kimi-code/path-guard.js" <<'JS'
        'use strict';
        const fs = require('node:fs');
        const os = require('node:os');
        const path = require('node:path');

        function deny(reason) {
          process.stderr.write(reason + '\n');
          process.exit(2);
        }
        process.on('uncaughtException', function (err) {
          deny('path guard: internal error: ' + (err && err.message ? err.message : String(err)));
        });

        // realpath of the longest existing prefix: resolves symlinks anywhere
        // in the path, and still works for an output file that does not exist yet.
        function canonical(p) {
          let head = path.resolve(p);
          const tail = [];
          for (;;) {
            try {
              return path.join(fs.realpathSync.native(head), ...tail);
            } catch (e) {
              const parent = path.dirname(head);
              if (parent === head) return path.join(head, ...tail);
              tail.unshift(path.basename(head));
              head = parent;
            }
          }
        }
        function within(child, parent) {
          const rel = path.relative(parent, child);
          return rel === '' || (!path.isAbsolute(rel) && rel.split(path.sep)[0] !== '..');
        }
        function hasGitSegment(rel) {
          return rel.split(path.sep).some(function (seg) { return seg.toLowerCase() === '.git'; });
        }
        // ripgrep matches these relative to the search root, so neither shape is
        // ever needed for a legitimate search; refuse them rather than reason
        // about ripgrep's anchoring rules.
        function unsafeGlob(g) {
          return typeof g === 'string' && (path.isAbsolute(g) || g.split(/[\\/]/).indexOf('..') !== -1);
        }

        const input = JSON.parse(fs.readFileSync(0, 'utf8'));
        const tool = String(input.tool_name || '');
        const args = input.tool_input && typeof input.tool_input === 'object' ? input.tool_input : {};

        const wsRaw = process.env.GITHUB_WORKSPACE;
        const outRaw = process.env.OUTPUT_PATH;
        if (!wsRaw || !outRaw) deny('path guard: GITHUB_WORKSPACE or OUTPUT_PATH is not set');
        const ws = canonical(wsRaw);
        const outDir = canonical(path.dirname(path.resolve(outRaw)));
        // Files the caller prepared for the model, plus its own output so it can
        // re-read what it wrote.
        const readableFiles = [process.env.CONTEXT_PATH, process.env.DIFF_PATH, outRaw]
          .filter(function (p) { return typeof p === 'string' && p.length > 0; })
          .map(canonical);

        if ((tool === 'Glob' && unsafeGlob(args.pattern)) || (tool === 'Grep' && unsafeGlob(args.glob))) {
          deny(tool + ' denied: glob patterns must be relative to the search path and must not contain "..".');
        }

        const raw = args.path;
        if (raw === undefined || raw === null) {
          // Grep/Glob search the workspace when path is omitted; Read/Write
          // without a path are rejected by the tool itself.
          process.exit(0);
        }
        if (typeof raw !== 'string') deny(tool + ' denied: path must be a string.');
        let expanded = raw;
        if (expanded === '~' || expanded.startsWith('~/')) expanded = path.join(os.homedir(), expanded.slice(1));
        // The CLI resolves relative paths against its cwd, which the run step
        // pins to the workspace.
        const target = canonical(path.resolve(wsRaw, expanded));

        if (tool === 'Write') {
          if (within(target, outDir)) process.exit(0);
          deny('Write denied: ' + raw + '. This review may only write its output file under ' + outDir + '.');
        }
        if (tool === 'Read' && readableFiles.indexOf(target) !== -1) process.exit(0);
        if (within(target, ws)) {
          if (hasGitSegment(path.relative(ws, target))) {
            deny(tool + ' denied: ' + raw + ' is inside .git/, which is not part of the code under review.');
          }
          process.exit(0);
        }
        deny(tool + ' denied: ' + raw + ' resolves outside the PR checkout (' + ws + '). Only the checked-out repository, the review context and the pre-fetched diff may be read.');
        JS

        cat > "$HOME/.kimi-code/config.toml" <<EOF
        default_permission_mode = "auto"

        [tools]
        enabled = ["Read", "Write", "Grep", "Glob"]

        # \`|| exit 2\` is load-bearing: the CLI treats a hook it cannot start
        # (node missing, script missing, exit 1) as ALLOW. This maps every
        # non-zero exit onto the deny code so breaking the guard cannot bypass it.
        # timeout is the schema maximum. A hook that exceeds it is treated as
        # ALLOW, so the window is made as small as the CLI permits: the script
        # needs milliseconds, and nothing the PR contains can slow it down.
        [[hooks]]
        event = "PreToolUse"
        matcher = "^(Read|Grep|Glob|Write)$"
        command = "node '${HOME}/.kimi-code/path-guard.js' || exit 2"
        timeout = 600

        [[permission.rules]]
        decision = "allow"
        pattern = "Write(${OUT_DIR}/*)"

        [[permission.rules]]
        decision = "deny"
        pattern = "Write"

        [[permission.rules]]
        decision = "deny"
        pattern = "Bash"
        EOF

        kimi doctor config
        # The guard must exist and parse before the run step starts, or the hook
        # would deny every tool call and the review would fail with no output.
        node --check "$HOME/.kimi-code/path-guard.js"
        echo "✅ Kimi engine: tool surface configured (path guard installed)"

    - name: Run AI PR review (Kimi Code)
      id: run
      shell: bash
      working-directory: ${{ github.workspace }}
      env:
        KIMI_MODEL_NAME: ${{ inputs.model }}
        KIMI_MODEL_API_KEY: ${{ inputs.api_key }}
        KIMI_MODEL_MAX_CONTEXT_SIZE: ${{ inputs.max_context_size }}
        KIMI_MODEL_PROVIDER_TYPE: ${{ inputs.provider_type }}
        KIMI_DISABLE_TELEMETRY: "1"
        KIMI_CODE_NO_AUTO_UPDATE: "1"
        CI: "1"
        INPUT_BASE_URL: ${{ inputs.base_url }}
        CONTEXT_PATH: ${{ inputs.review_context_path }}
        DIFF_PATH: ${{ inputs.pr_diff_path }}
        OUTPUT_PATH: ${{ inputs.output_path }}
      run: |
        [[ -s "$CONTEXT_PATH" ]] || { echo "❌ Kimi engine: missing or empty review context at $CONTEXT_PATH"; exit 1; }
        [[ -s "$DIFF_PATH"    ]] || { echo "❌ Kimi engine: missing or empty PR diff at $DIFF_PATH"; exit 1; }

        # base_url is accepted with or without a trailing /v1 so one caller-facing
        # value works for every engine. The anthropic engine strips it instead.
        BASE_URL="${INPUT_BASE_URL%/}"
        [[ "$BASE_URL" == */v1 ]] || BASE_URL="${BASE_URL}/v1"
        export KIMI_MODEL_BASE_URL="$BASE_URL"
        echo "🔧 Kimi engine | model=$KIMI_MODEL_NAME | base_url=$BASE_URL"

        # Quoted heredoc: the inputs.* expressions below are substituted by
        # Actions before bash sees this script, so no shell expansion happens in
        # the prompt body.
        #
        # Do NOT write an empty expression pair in this block. Actions scans the
        # whole run: string for expressions, including text bash treats as a
        # comment, and an empty one fails manifest validation before any step
        # runs — which is exactly how this file got broken once already.
        # The step-by-step review procedure lives in the caller-built context
        # file (its "Review Procedure" section), NOT here — it is engine-neutral,
        # and duplicating it per engine let the copies drift. This prompt only
        # bootstraps the model into that file.
        cat > /tmp/review_prompt.txt <<'EOF'
        REPO: ${{ inputs.repository }}
        PR NUMBER: ${{ inputs.pr_number }}

        Read ${{ inputs.review_context_path }} and follow it exactly. It contains
        the full review instructions, PR context, previous review (if any),
        acknowledged suggestions to skip, and the required output format — plus a
        "Review Procedure" section telling you what else to read, including the
        pre-fetched PR diff at ${{ inputs.pr_diff_path }}. You have no shell tool;
        everything you need is on disk.

        HOW THIS TASK IS DELIVERED: your chat reply is discarded and never reaches
        anyone. The ONLY output that counts is the file ${{ inputs.output_path }},
        written with the Write tool. So your final action must be that Write call,
        containing the complete review. Writing an analysis as your reply instead
        means the review is lost and the job fails.
        EOF

        # Dumps the CLI's own log on failure. Without this the step reports only
        # the CLI's one-line summary (e.g. "provider.api_error: 400 The request
        # was invalid") and points at a log file on a runner that is already gone,
        # so the actual provider request and response body are unrecoverable.
        # Secrets registered with the job are masked in these logs by Actions.
        # Runs only on failure. Deliberately short: the long troubleshooting essay
        # this used to print was scaffolding for diagnosing one specific 400 (a
        # provider_type/base_url mismatch), which is now fixed and documented in
        # AI_PR_REVIEW_README.md. What stays is what a failing run cannot be
        # debugged without: the resolved config, the input sizes, and the CLI's own
        # log if it wrote one.
        # ALWAYS call this as `( dump_kimi_log ) || true`. The subshell is what
        # keeps the `set +e` below from leaking: some call sites now continue
        # running afterwards (the retry, and the salvage path), and silently
        # disabling -e for the rest of the step would be a nasty surprise. The
        # `|| true` covers the function itself ending non-zero.
        dump_kimi_log() {
          # A diagnostic must never be killed by the thing it is diagnosing. The
          # step runs under `bash -e -o pipefail`, so any non-zero command in here
          # would abort the dump partway and hide the rest.
          set +e +o pipefail

          # tr strips the padding BSD wc emits, harmless on the Linux runner.
          bytes_of() { wc -c < "$1" 2>/dev/null | tr -d '[:space:]' || echo '?'; }

          echo "ℹ️  config: model=$KIMI_MODEL_NAME base_url=$KIMI_MODEL_BASE_URL provider_type=$KIMI_MODEL_PROVIDER_TYPE max_context_size=$KIMI_MODEL_MAX_CONTEXT_SIZE"
          echo "ℹ️  input bytes: context=$(bytes_of "$CONTEXT_PATH") diff=$(bytes_of "$DIFF_PATH") prompt=$(bytes_of /tmp/review_prompt.txt)"
          # Whether the review survived is the first thing anyone reading this
          # needs, and it used to be absent: a CLI that dies after writing looks
          # identical in the log to one that never wrote anything, and the two
          # have completely different causes.
          if [[ -s "$OUTPUT_PATH" ]]; then
            echo "ℹ️  review file: PRESENT at $OUTPUT_PATH ($(bytes_of "$OUTPUT_PATH") bytes) — the review itself survived"
          else
            echo "ℹ️  review file: ABSENT at $OUTPUT_PATH — the model never called Write"
          fi

          # The CLI names $HOME/.kimi-code/logs/kimi-code.log in its errors but does
          # not always create it, so search rather than assume.
          # `|| true` is load-bearing: grep exits 1 on no match, and under pipefail
          # + set -e that would abort this function mid-dump.
          KIMI_LOGS=$(find "$HOME" /tmp -maxdepth 5 -type f -name '*.log' 2>/dev/null | grep -i kimi | head -3 || true)
          if [[ -n "$KIMI_LOGS" ]]; then
            while IFS= read -r log; do
              lines=$(wc -l < "$log" | tr -d '[:space:]')
              echo "::group::$log (last 200 of $lines lines)"
              tail -n 200 "$log"
              echo "::endgroup::"
              [[ "$lines" -gt 200 ]] && echo "⚠️  truncated: $log has $lines lines"
            done <<< "$KIMI_LOGS"
          else
            echo "ℹ️  no kimi log written; provider response body unavailable"
          fi

          echo "ℹ️  Troubleshooting: AI_PR_REVIEW_README.md. When this failed on the"
          echo "    FIRST request, suspect config: a model/provider_type/base_url"
          echo "    mismatch (those must agree), or max_context_size above what the"
          echo "    endpoint allows for this model. When it failed only after the"
          echo "    agent had started reading files, config is probably fine —"
          echo "    suspect the endpoint rejecting a mid-conversation request, and"
          echo "    check whether the model alias fronts more than one deployment."
          echo "    'The API returned an empty response' means the model ended its"
          echo "    turn with no content and no tool call: it stopped without"
          echo "    writing the review, or the provider returned only reasoning"
          echo "    content. That one is transient — the retry below covers it."
        }

        # Clean slate first. The checks below treat a non-empty file at this path
        # as THIS run's deliverable, so a leftover from an earlier job — possible
        # on a persistent runner, same reason $HOME/.kimi-code is recreated in the
        # configure step — would be posted as a review of the wrong PR.
        rm -f "$OUTPUT_PATH"

        # Read once, outside the loop: both attempts then provably run the same
        # prompt. Re-reading per attempt would also mean an empty prompt reaching
        # the CLI — and a garbage review — if the file ever went missing between
        # attempts, rather than failing.
        REVIEW_PROMPT="$(cat /tmp/review_prompt.txt)"

        # No GitHub token in this step's env and no Bash tool in the config: the
        # agent cannot reach the GitHub API at all. The caller's post step is the
        # only thing that can comment on the PR.
        #
        # Run it up to twice. The failure this covers is the CLI aborting with
        # "The API returned an empty response (no content, no tool calls)" —
        # kimi-k3 ending a turn with neither, which the CLI treats as fatal after
        # the agent has already spent minutes reading the code. It is transient:
        # the same PR succeeds on a re-run. Retrying only when NO review was
        # written keeps the cost bounded (worst case two passes inside the
        # caller's 60-minute timeout) and never re-runs a review that worked.
        for attempt in 1 2; do
          kimi -p "$REVIEW_PROMPT" && KIMI_STATUS=0 || KIMI_STATUS=$?

          # A written review is the deliverable, so it outranks the exit code:
          # the CLI can fail on a trailing empty turn AFTER the model has written
          # the file, and failing the job then would discard a complete review.
          # The file is produced by a single Write call, so a non-empty file is a
          # whole review rather than a partial one.
          if [[ -s "$OUTPUT_PATH" ]]; then
            if [[ "$KIMI_STATUS" -ne 0 ]]; then
              echo "⚠️  Kimi engine: CLI exited $KIMI_STATUS AFTER writing the review — keeping the review and continuing."
              ( dump_kimi_log ) || true
            fi
            break
          fi

          if [[ "$attempt" -eq 1 ]]; then
            echo "⚠️  Kimi engine: CLI exited $KIMI_STATUS with no review written — retrying once."
            ( dump_kimi_log ) || true
            echo "🔁 Kimi engine: attempt 2 of 2"
          fi
        done

        # Fail here, named, rather than letting the caller report a generic
        # "review file missing" — all steps in a composite action share one log
        # group, so an engine-attributed error is what makes this locatable.
        if [[ ! -s "$OUTPUT_PATH" ]]; then
          echo "❌ Kimi engine: no review written to $OUTPUT_PATH after 2 attempts (last CLI exit: $KIMI_STATUS)"
          ( dump_kimi_log ) || true
          exit 1
        fi
        echo "✅ Kimi engine: review written ($(wc -c < "$OUTPUT_PATH") bytes)"
        echo "output_path=$OUTPUT_PATH" >> "$GITHUB_OUTPUT"
