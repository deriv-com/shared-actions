name: Antigravity Engine Smoke Test (throwaway)

# Throwaway caller for smoke-testing the antigravity engine against live
# LiteLLM using gemini-4-argon while gemini-4-carbon is not yet deployed on
# the proxy. Commit 2 sets antigravity_effort: high and exercises follow-up
# review mode. Not for merge.

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  ai-review:
    uses: deriv-com/shared-actions/.github/workflows/ai-pr-review.yml@smoke/antigravity-base
    permissions:
      contents: read
      pull-requests: write
      issues: write
    with:
      engine: antigravity
      model: gemini-4-argon
      antigravity_effort: high
    secrets:
      LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
      AGENT_METRICS_API_URL: ${{ secrets.AGENT_METRICS_API_URL }}
      AGENT_METRICS_API_KEY: ${{ secrets.AGENT_METRICS_API_KEY }}
