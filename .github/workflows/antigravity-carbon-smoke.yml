name: Antigravity Gemini 4 Carbon Smoke (throwaway)

# Throwaway caller exercising follow-up review mode and explicit
# antigravity_effort: high on default model gemini-4-carbon at 29ac485.
# Not for merge (PR #213 will be closed unmerged right after this run).

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  ai-review:
    uses: deriv-com/shared-actions/.github/workflows/ai-pr-review.yml@smoke/antigravity-carbon-base
    permissions:
      contents: read
      pull-requests: write
      issues: write
    with:
      engine: antigravity
      antigravity_effort: high
    secrets:
      LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
      AGENT_METRICS_API_URL: ${{ secrets.AGENT_METRICS_API_URL }}
      AGENT_METRICS_API_KEY: ${{ secrets.AGENT_METRICS_API_KEY }}
