name: Kimi smoke test (throwaway, do not merge)

# pull_request (not pull_request_target) so GitHub runs THIS file from the PR,
# which lets the kimi engine with the 2.3.2 pin run before it is on master.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

jobs:
  ai-review:
    uses: deriv-com/shared-actions/.github/workflows/ai-pr-review.yml@smoke/kimi-base
    permissions:
      contents: read
      pull-requests: write
      issues: write
    with:
      engine: kimi
      model: kimi-k3
      provider_type: openai
    secrets:
      LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
