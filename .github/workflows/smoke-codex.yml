name: Codex smoke test (throwaway, do not merge)

# pull_request (not pull_request_target) so GitHub runs THIS file from the PR,
# which lets the codex engine from PR #143 run before it is on master.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

jobs:
  ai-review:
    uses: deriv-com/shared-actions/.github/workflows/ai-pr-review.yml@smoke/codex-base
    permissions:
      contents: read
      pull-requests: write
      issues: write
    with:
      engine: codex
      model: gpt-6.1-sol
      reasoning_effort: low
    secrets:
      LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
